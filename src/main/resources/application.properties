spring.application.name=springSecurity-library
spring.datasource.url=jdbc:postgresql://localhost:5432/springSecurityLibrary
spring.datasource.username=postgres
spring.datasource.password=postgres

# Permet à la base de données de se mettre à jour s'il y a des modifications d'apportées
spring.jpa.hibernate.ddl-auto=update

# Recréation de la bdd à chaque run du server
#spring.jpa.hibernate.ddl-auto=create-drop

# The first line logs the SQL queries, and the second statement logs the prepared statement parameters.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE